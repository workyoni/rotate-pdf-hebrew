name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymupdf pillow pytesseract

      - name: Build lightweight standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RotatePdfHebrew" `
            rotate_pdf_hebrew.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotatePdfHebrew-Windows-EXE
          path: dist\RotatePdfHebrew.exe
          if-no-files-found: error
