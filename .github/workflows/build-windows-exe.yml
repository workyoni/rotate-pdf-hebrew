name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "גרסת Release (למשל v1.0.1)"
        required: true
        default: "v1.0.1"
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymupdf pillow pytesseract

      - name: Build lightweight standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RotatePdfHebrew" `
            rotate_pdf_hebrew.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotatePdfHebrew-Windows-EXE
          path: dist\RotatePdfHebrew.exe
          if-no-files-found: error

      - name: Publish EXE to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "RotatePdfHebrew ${{ inputs.tag }}"
          files: dist\RotatePdfHebrew.exe
