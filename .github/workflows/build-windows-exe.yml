name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR with Hebrew language pack
        shell: pwsh
        run: |
          winget install --id UB-Mannheim.TesseractOCR -e --silent --accept-package-agreements --accept-source-agreements
          $tessSrc = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tessSrc\tesseract.exe")) {
            choco install tesseract --no-progress -y
          }
          New-Item -ItemType Directory -Force -Path "$tessSrc\tessdata" | Out-Null
          if (-not (Test-Path "$tessSrc\tessdata\heb.traineddata")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/heb.traineddata" -OutFile "$tessSrc\tessdata\heb.traineddata"
          }
          if (-not (Test-Path "$tessSrc\tessdata\eng.traineddata")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "$tessSrc\tessdata\eng.traineddata"
          }
          Copy-Item -Path $tessSrc -Destination ".\tesseract_bundle" -Recurse

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymupdf pillow pytesseract

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RotatePdfHebrew" `
            --add-data "tesseract_bundle;tesseract_bundle" `
            rotate_pdf_hebrew.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotatePdfHebrew-Windows-EXE
          path: dist\RotatePdfHebrew.exe
          if-no-files-found: error
